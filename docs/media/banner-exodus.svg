<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-label="Project Exodus — banner">
  <title>Project Exodus — banner</title>
  <defs>
    <radialGradient id="glow" cx="18%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hazard" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="28" fill="#f59e0b" opacity="0.85"/>
      <rect x="14" width="14" height="28" fill="#0e1216"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" fill="#07090c"/>
  <rect width="1280" height="360" fill="url(#glow)"/>
  <rect width="1280" height="360" fill="url(#glow2)"/>

  <!-- marca -->
  <g transform="translate(72 88) scale(1.45)">
    <path d="M46 46 L16 110 L112 110 L82 46" fill="none" stroke="#f59e0b" stroke-width="9"
          stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="59.5" y="50" width="9" height="16" rx="4" fill="#22d3ee" opacity="0.4"/>
    <circle cx="64" cy="30" r="9" fill="#22d3ee"/>
    <circle cx="64" cy="30" r="3.4" fill="#e6fbff"/>
    <circle cx="64" cy="86" r="15" fill="#0e1216" stroke="#22d3ee" stroke-width="6"/>
    <circle cx="64" cy="86" r="4.6" fill="#22d3ee"/>
  </g>

  <!-- tipografia -->
  <text x="368" y="172" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
        font-size="78" font-weight="900" letter-spacing="6" fill="#f4efe6">PROJECT</text>
  <text x="368" y="252" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
        font-size="78" font-weight="900" letter-spacing="6" fill="#f59e0b">EXODUS</text>

  <text x="372" y="296" font-family="Consolas,'Courier New',monospace"
        font-size="19" letter-spacing="4" fill="#9fb3c8">RTS PÓS-APOCALÍPTICO · SIMULAÇÃO DETERMINÍSTICA · LAN/TAILSCALE</text>

  <text x="372" y="120" font-family="Consolas,'Courier New',monospace"
        font-size="15" letter-spacing="6" fill="#22d3ee">// PROTOCOLO MILITAR DE SOBREVIVÊNCIA — DEFCON 1</text>

  <!-- faixa hazard -->
  <rect x="0" y="338" width="1280" height="22" fill="url(#hazard)" opacity="0.9"/>
  <rect x="0" y="332" width="1280" height="6" fill="#0e1216"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Project Exodus — marca">
  <title>Project Exodus — marca</title>
  <!--
    Marca "Breakout": o triângulo de alerta (herança do favicon original) com o
    vértice rompido; o núcleo ciano escapa pela abertura. Exodus é a fuga do colapso.
    Cores da identidade: âmbar #f59e0b (sucata/sinal), ciano #22d3ee (núcleo de IA),
    fundo #0e1216 (casco).
  -->
  <path d="M46 46 L16 110 L112 110 L82 46"
        fill="none" stroke="#f59e0b" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- rastro de fuga -->
  <rect x="59.5" y="50" width="9" height="16" rx="4" fill="#22d3ee" opacity="0.4"/>
  <!-- núcleo escapando -->
  <circle cx="64" cy="30" r="9" fill="#22d3ee"/>
  <circle cx="64" cy="30" r="3.4" fill="#e6fbff"/>
  <!-- núcleo em terra -->
  <circle cx="64" cy="86" r="15" fill="#0e1216" stroke="#22d3ee" stroke-width="6"/>
  <circle cx="64" cy="86" r="4.6" fill="#22d3ee"/>
</svg>
